[package]
name = "nova1"
version = "1.0.0"
edition = "2021"
description = "Nova 1 : modèles de NOVA (compréhension des demandes, vision), créés et entraînés de zéro (aucune dépendance)."
publish = false

[lib]
name = "nova1"

[[bin]]
name = "nova1-train"
path = "src/bin/train.rs"

[[bin]]
name = "nova1-train-vision"
path = "src/bin/train_vision.rs"

[dependencies]

[profile.release]
opt-level = 3
