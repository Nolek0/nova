<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Nova Code</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/island.css">
  <script type="module" src="js/island.js"></script>
</head>
<body class="island-body">
  <div class="island" id="island">
    <div class="isl-live" id="live"><span class="isl-dot"></span></div>
    <div class="isl-panel" id="panel">
      <div class="isl-head"><span class="mark"></span><b>Nova Code</b><span class="isl-proj" id="proj" translate="no"></span><span class="grow"></span><span class="isl-state" id="state">Prêt</span></div>
      <div class="isl-preview" id="preview">Passe la souris sur l'encoche pour retrouver Nova Code.</div>
      <form class="isl-ask" id="ask" autocomplete="off"><input id="q" placeholder="Demander à Nova Code…" aria-label="Demande pour Nova Code"><button class="btn small primary" type="submit">Envoyer</button><button class="btn small" type="button" id="open">Ouvrir</button></form>
    </div>
  </div>
</body>
</html>
